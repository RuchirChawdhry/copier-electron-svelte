name: Windows UI screenshots (WinApp)

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  screenshots:
    name: Capture Electron screens
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Check out template
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2

      - name: Generate app from Copier defaults
        run: uvx --from copier==9.19.1 copier copy --defaults --skip-tasks . .ci-generated

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .ci-generated/.node-version
          package-manager-cache: false

      - name: Install template's pnpm version
        working-directory: .ci-generated
        run: |
          $packageManager = (Get-Content package.json -Raw | ConvertFrom-Json).packageManager
          npm install --global $packageManager

      - name: Install dependencies
        working-directory: .ci-generated
        run: pnpm install --frozen-lockfile

      - name: Build Electron app
        working-directory: .ci-generated
        run: pnpm build

      - name: Install Microsoft WinApp CLI
        uses: microsoft/setup-WinAppCli@9288bd0729bd3f71e2ed1b9eb247dc91470b824e # v0.3
        with:
          version: v0.8.0

      - name: Capture application screens with WinApp
        working-directory: .ci-generated
        run: pnpm test:screenshots

      - name: Replace tracked screenshots
        shell: pwsh
        run: |
          $destination = 'screenshots'
          New-Item -ItemType Directory -Path $destination -Force | Out-Null
          Get-ChildItem -Path $destination -Filter '*.png' -File | Remove-Item -Force
          Copy-Item -Path '.ci-generated/screenshots/*.png' -Destination $destination -Force

      - name: Commit updated screenshots
        shell: pwsh
        run: |
          git add -A -- screenshots
          $legacy = @(git ls-files -- 'assets/screenshots/*.png')
          if ($legacy.Count -gt 0) {
            git rm -- $legacy
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          $changed = @(git diff --cached --name-only -- screenshots assets/screenshots)
          if ($changed.Count -eq 0) {
            Write-Host 'Screenshots have not changed.'
            exit 0
          }

          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'docs: refresh Windows UI screenshots'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git push origin "HEAD:$env:GITHUB_REF"

      - name: Upload screen captures and test reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-ui-screenshots
          path: |
            screenshots/
            .ci-generated/test-results/
          if-no-files-found: warn
