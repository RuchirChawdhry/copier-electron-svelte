name: Windows template tests

on:
  push:
    branches: [main]
    paths:
      - 'copier.yml'
      - 'template/**'
      - 'Taskfile.yml'
      - '.github/workflows/windows-ci.yml'
  pull_request:
    paths:
      - 'copier.yml'
      - 'template/**'
      - 'Taskfile.yml'
      - '.github/workflows/windows-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    name: Render and test on Windows
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Check out template
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          cache-dependency-glob: copier.yml

      - name: Generate app from Copier defaults
        run: uvx --from copier==9.19.1 copier copy --defaults --skip-tasks . .ci-generated

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .ci-generated/.node-version
          package-manager-cache: false

      - name: Install template's pnpm version
        working-directory: .ci-generated
        run: |
          $packageManager = (Get-Content package.json -Raw | ConvertFrom-Json).packageManager
          npm install --global $packageManager

      - name: Install Task
        uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e # v2.2.0
        with:
          version: 3.42.1

      - name: Locate pnpm store
        id: pnpm-store
        working-directory: .ci-generated
        run: '"path=$(pnpm store path --silent)" >> $env:GITHUB_OUTPUT'

      - name: Cache pnpm dependencies
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('template/pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-

      - name: Install dependencies
        working-directory: .ci-generated
        run: pnpm install --frozen-lockfile

      - name: Lint
        working-directory: .ci-generated
        run: pnpm lint

      - name: Typecheck
        working-directory: .ci-generated
        run: pnpm typecheck

      - name: Unit tests
        working-directory: .ci-generated
        run: pnpm test

      - name: Build Electron app
        working-directory: .ci-generated
        run: task build

      - name: Install Playwright Chromium
        working-directory: .ci-generated
        run: pnpm exec playwright install chromium

      - name: Desktop integration tests
        working-directory: .ci-generated
        run: pnpm test:e2e

      - name: Upload desktop test reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-test-reports
          path: |
            .ci-generated/test-results/
            .ci-generated/playwright-report/
          if-no-files-found: ignore
