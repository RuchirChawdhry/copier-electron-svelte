name: Windows taskbar capability probe

on:
  pull_request:
    paths:
      - ".github/workflows/jumplist-probe.yml"

permissions:
  contents: read

jobs:
  taskbar:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Install Microsoft WinApp CLI
        uses: microsoft/setup-WinAppCli@9288bd0729bd3f71e2ed1b9eb247dc91470b824e # v0.3
        with:
          version: v0.8.0

      - name: Inspect runner desktop and Explorer taskbar
        shell: pwsh
        run: |
          Add-Type -Namespace TaskbarProbe -Name Native -MemberDefinition @'
          [System.Runtime.InteropServices.DllImport("user32.dll", CharSet = System.Runtime.InteropServices.CharSet.Unicode)]
          public static extern System.IntPtr FindWindow(string className, string windowName);
          '@
          $runnerSession = (Get-Process -Id $PID).SessionId
          $explorer = @(Get-Process explorer -ErrorAction SilentlyContinue | Select-Object Id, SessionId)
          $taskbar = [TaskbarProbe.Native]::FindWindow('Shell_TrayWnd', $null)
          Write-Host "Runner session: $runnerSession"
          Write-Host "Explorer processes: $($explorer | ConvertTo-Json -Compress)"
          Write-Host "Taskbar HWND in this session: $taskbar"
          if ($taskbar -eq [IntPtr]::Zero) { throw 'Explorer taskbar unavailable' }
          winapp ui inspect -w $taskbar --interactive --json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Open a real taskbar Jump List through WinApp
        shell: pwsh
        run: |
          Add-Type -Namespace TaskbarProbe -Name Native -MemberDefinition @'
          [System.Runtime.InteropServices.DllImport("user32.dll", CharSet = System.Runtime.InteropServices.CharSet.Unicode)]
          public static extern System.IntPtr FindWindow(string className, string windowName);
          '@
          $taskbar = [TaskbarProbe.Native]::FindWindow('Shell_TrayWnd', $null)
          winapp ui click 'Appid: Microsoft.Windows.Explorer' -w $taskbar --right --json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          winapp ui list-windows --show-hidden --json
          $menuTree = winapp ui inspect -w $taskbar --depth 9 --json | ConvertFrom-Json
          Write-Host "Taskbar tree after right-click: $($menuTree | ConvertTo-Json -Depth 20 -Compress)"
          winapp ui screenshot -w $taskbar --output taskbar-wgc.png --json
          winapp ui screenshot -w $taskbar --capture-screen --output taskbar-screen.png --json

      - name: Upload taskbar screenshots
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: taskbar-probe
          path: taskbar-*.png
